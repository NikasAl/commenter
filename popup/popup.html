<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commenter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ════════════ Хедер ════════════ -->
  <header class="app-header">
    <div class="app-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="app-title">Commenter</span>
    </div>
    <button id="btn-open-options" class="btn btn-ghost btn-sm open-options-btn" title="Открыть основную страницу">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Полная версия
    </button>
  </header>

  <!-- ════════════ Контент ════════════ -->
  <main class="popup-content">
    <p class="popup-description">
      Для управления темами, тезисами, шаблонами и настройками откройте полную страницу управления.
    </p>
    <button id="btn-open-options-main" class="btn btn-primary btn-block">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Открыть Commenter
    </button>
    <div class="popup-shortcuts">
      <p class="shortcuts-title">Горячие клавиши на VK:</p>
      <div class="shortcut-item">
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd>
        <span>Собрать промпт</span>
      </div>
      <div class="shortcut-item">
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd>
        <span>Генерация ответа</span>
      </div>
      <div class="shortcut-item">
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd>
        <span>Новый тезис</span>
      </div>
    </div>
  </main>

  <!-- Скрипты -->
  <script type="module" src="popup.js"></script>
</body>
</html>
